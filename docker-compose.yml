services:
  ollama:
    build:
      context: .
      dockerfile: docker/Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q '${OLLAMA_MODEL}' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["cli"]
    depends_on:
      ollama:
        condition: service_healthy
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - plan_data:/app/plans

  webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uv run uvicorn app.webhook:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - plan_data:/app/plans
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
  plan_data:
