services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["cli"]
    env_file: .env
    volumes:
      - plan_data:/app/plans

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - plan_data:/app/plans

volumes:
  plan_data:
